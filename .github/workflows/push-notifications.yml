name: Send Push Notifications

on:
  workflow_dispatch:         # manual trigger only — Edge Function handles automated delivery
    inputs:
      test_mode:
        description: 'Send a test notification to all active subscriptions immediately (ignores time window)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        run: npm install --prefix scripts

      - name: Send notifications
        run: node scripts/send-notifications.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
