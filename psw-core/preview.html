<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSW Core Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Open+Sans:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
.dev-bar{width:100%;background:#0d0520;border-bottom:2px solid rgba(240,192,64,0.4);display:flex;align-items:center;font-family:'Rajdhani',sans-serif;font-size:12px;}
.dev-bar-label{padding:0 14px;color:#f0c040;font-weight:700;letter-spacing:0.1em;border-right:1px solid rgba(240,192,64,0.25);height:36px;display:flex;align-items:center;white-space:nowrap;gap:6px;}
.dev-btn{padding:0 18px;height:36px;display:flex;align-items:center;color:#8aafd4;letter-spacing:0.06em;text-transform:uppercase;text-decoration:none;border-right:1px solid rgba(255,255,255,0.06);cursor:pointer;transition:background 0.15s,color 0.15s;}
.dev-btn:hover{background:rgba(0,180,216,0.12);color:#00b4d8;}
.dev-btn.active{background:rgba(0,180,216,0.18);color:#00b4d8;font-weight:700;}
.dev-badge{margin-left:auto;padding:0 14px;height:36px;display:flex;align-items:center;color:rgba(240,192,64,0.5);font-size:10px;letter-spacing:0.08em;}
</style>
<script>
(function () {
  var hash = window.location.hash.replace('#', '');
  var m = (hash.match(/(?:^|market=)([^&]+)/) || [])[1] || 'cerritos';
  var configs = {
    cerritos: {
      marketName:    'Peptide Supply Warehouse',
      marketCity:    'Cerritos',
      contactName:   'Michael John',
      whatsapp:      '+1-310-683-0049',
      mobile:        '+52-55-2446-9745',
      sheetApiUrl:   '',
      defaultLang:   'en',
      accentColor:   '#00b4d8',
      isInfluencer:  false,
      pricingMode:   'standard',
      customPrices:  {},
    },
    sandiego: {
      marketName:    'Peptide Supply Warehouse – San Diego',
      marketCity:    'San Diego',
      contactName:   'Michael John',
      whatsapp:      '+1-310-683-0049',
      mobile:        '+1-310-683-0049',
      sheetApiUrl:   '',
      defaultLang:   'en',
      accentColor:   '#9c79ff',
      isInfluencer:  false,
      pricingMode:   'standard',
      customPrices:  {},
    },
    tijuana: {
      marketName:    'Peptide Supply Warehouse – Tijuana',
      marketCity:    'Tijuana',
      contactName:   'Michael John',
      whatsapp:      '+52-55-2446-9745',
      mobile:        '+52-55-2446-9745',
      sheetApiUrl:   '',
      defaultLang:   'es',
      accentColor:   '#00c896',
      isInfluencer:  false,
      pricingMode:   'standard',
      customPrices:  {},
    },
  };
  window.PSW_CONFIG = configs[m] || configs.cerritos;
  window._PSW_PREVIEW_MARKET = m;
})();
</script>
</head>
<body>

<script src="./psw-core.js"></script>

<script>
// psw-core.js wipes body.innerHTML, so we build the dev bar fresh after it runs
(function () {
  var m = window._PSW_PREVIEW_MARKET || 'cerritos';

  var bar = document.createElement('div');
  bar.className = 'dev-bar';
  bar.innerHTML =
    '<div class="dev-bar-label">⚠ DEV PREVIEW</div>' +
    ['cerritos','sandiego','tijuana'].map(function(id) {
      var label = {cerritos:'Cerritos (MX)', sandiego:'San Diego', tijuana:'Tijuana'}[id];
      var active = id === m ? ' active' : '';
      return '<span class="dev-btn' + active + '" onclick="switchMarket(\'' + id + '\')">' + label + '</span>';
    }).join('') +
    '<div class="dev-badge">NOT LIVE — FEATURE BRANCH ONLY</div>';

  document.body.insertBefore(bar, document.body.firstChild);
})();

function switchMarket(m) {
  window.location.hash = 'market=' + m;
  window.location.reload();
}
</script>

</body>
</html>
